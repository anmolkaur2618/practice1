<body>
    
  <center>
    <div class="contact">
      <div class="header">
        <h2>contact</h2>
        <h3> Get in touch contact us </h3>
      </div>
      <div class="container">
        <form action="">
           <i class="fa-solid fa-users fa-xs" style="color: #15294d;"></i>

            <input type="text" class="data" name="" id="yname">
         <i class="fa-solid fa-phone-volume" style="color: #213961;"></i>

          <input type="text" class="data" name="" id="phone">
         <i class="fa-solid fa-inbox" style="color: #1b3c73;"></i>
          <label for="Email">Enter your Email</label>
          <input type="email" class="data" name="" id="email">
          <i class="fa-solid fa-message" style="color: #2f4e83;"></i>
          <label for="Message">Write your message </label>
          <input type="text" class="data" name="" id="msg">
        </center>
